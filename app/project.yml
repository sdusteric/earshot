name: Earshot
options:
  bundleIdPrefix: com.earshot
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  EarshotKit:
    path: EarshotKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  Earshot:
    type: application
    platform: macOS
    sources:
      - Earshot
      # Credit and license text for Sparkle, FluidAudio and the models. The repo copy is the source.
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: EarshotKit
      - package: Sparkle
    info:
      path: Earshot/Info.plist
      properties:
        CFBundleDisplayName: Earshot
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAudioCaptureUsageDescription: "Earshot lowers other apps' audio while it talks. It never records or saves that audio."
        # Earshot starts and talks to Claude Code sessions in your project folders. macOS asks
        # for access when a folder is in one of these places.
        NSDocumentsFolderUsageDescription: "Earshot talks to Claude Code sessions in your project folders. It needs access when a project is in Documents."
        NSDesktopFolderUsageDescription: "Earshot talks to Claude Code sessions in your project folders. It needs access when a project is on the Desktop."
        NSDownloadsFolderUsageDescription: "Earshot talks to Claude Code sessions in your project folders. It needs access when a project is in Downloads."
        NSRemovableVolumesUsageDescription: "Earshot talks to Claude Code sessions in your project folders. It needs access when a project is on an external drive."
        NSNetworkVolumesUsageDescription: "Earshot talks to Claude Code sessions in your project folders. It needs access when a project is on a network drive."
        NSMicrophoneUsageDescription: "Earshot listens for \"Hey Earshot\" and for commands while you hold the hotkey. Audio stays on this Mac and is never saved."
        # The feed is packaging/appcast.xml on main. release-app.sh adds each release to it.
        SUFeedURL: "https://raw.githubusercontent.com/sdusteric/earshot/main/packaging/appcast.xml"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
    entitlements:
      path: Earshot/Earshot.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earshot.app
        PRODUCT_NAME: Earshot
        DEVELOPMENT_TEAM: 8N9KUZLT8N
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # PLACEHOLDER: paste the public key from Sparkle's generate_keys here (docs/RELEASE.md).
        # Until then the updater stays off and release-app.sh refuses to release.
        SPARKLE_PUBLIC_KEY: "SPARKLE_PUBLIC_KEY_NOT_SET"
        GENERATE_INFOPLIST_FILE: NO
