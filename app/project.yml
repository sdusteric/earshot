name: Kobi
options:
  bundleIdPrefix: com.kobi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  KobiKit:
    path: KobiKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  Kobi:
    type: application
    platform: macOS
    sources:
      - Kobi
      # Credit and license text for Sparkle, FluidAudio and the models. The repo copy is the source.
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: KobiKit
      - package: Sparkle
    info:
      path: Kobi/Info.plist
      properties:
        CFBundleDisplayName: Kobi
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAudioCaptureUsageDescription: "Kobi lowers other apps' audio while it talks. It never records or saves that audio."
        NSSpeechRecognitionUsageDescription: "Kobi hears your voice commands a second way with Apple's on-device speech recognition. Nothing leaves your Mac."
        # Kobi starts and talks to Claude Code sessions in your project folders. macOS asks
        # for access when a folder is in one of these places.
        NSDocumentsFolderUsageDescription: "Kobi talks to Claude Code sessions in your project folders. It needs access when a project is in Documents."
        NSDesktopFolderUsageDescription: "Kobi talks to Claude Code sessions in your project folders. It needs access when a project is on the Desktop."
        NSDownloadsFolderUsageDescription: "Kobi talks to Claude Code sessions in your project folders. It needs access when a project is in Downloads."
        NSRemovableVolumesUsageDescription: "Kobi talks to Claude Code sessions in your project folders. It needs access when a project is on an external drive."
        NSNetworkVolumesUsageDescription: "Kobi talks to Claude Code sessions in your project folders. It needs access when a project is on a network drive."
        NSMicrophoneUsageDescription: "Kobi listens for \"Hey Kobi\" and for commands while you hold the hotkey. Audio stays on this Mac and is never saved."
        # The feed is packaging/appcast.xml on main. release-app.sh adds each release to it.
        SUFeedURL: "https://raw.githubusercontent.com/sdusteric/kobi/main/packaging/appcast.xml"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
    entitlements:
      path: Kobi/Kobi.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kobi.app
        PRODUCT_NAME: Kobi
        DEVELOPMENT_TEAM: 8N9KUZLT8N
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # Apple Silicon only: the voice and listening models are untested on Intel.
        ARCHS: arm64
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # PLACEHOLDER: paste the public key from Sparkle's generate_keys here (docs/RELEASE.md).
        # Until then the updater stays off and release-app.sh refuses to release.
        SPARKLE_PUBLIC_KEY: "SPARKLE_PUBLIC_KEY_NOT_SET"
        GENERATE_INFOPLIST_FILE: NO
        # Drawn by scripts/app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
